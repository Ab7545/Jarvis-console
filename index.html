<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J.A.R.V.I.S. // Adukkathil Industries</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="grid-bg"></div>

  <!-- SECURITY GATE OVERLAY (PIN + ACCESS TOKEN ENTRY) -->
  <div id="lock-screen" class="overlay">
    <div class="hud-card lock-box">
      <div class="arc-ring">
        <div class="arc-core"></div>
      </div>
      <div class="sys-tag">ADUKKATHIL INDUSTRIES  ( classified protocol ) </div>
      <h1>MAINFRAME ACCESS</h1>
      <p class="subtext">Encrypted Uplink • Authorization Required</p>

      <div class="input-group">
        <label for="pin-input">SECURITY PIN</label>
        <input id="pin-input" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off" />
      </div>

      <div class="input-group">
        <label for="endpoint-input">NEURAL CORE ENDPOINT</label>
        <input id="endpoint-input" type="url" value="https://api.abenbinu.com" />
      </div>

      <button id="unlock-btn" class="primary-btn">INITIALIZE UPLINK</button>
      <div id="auth-error" class="error-msg"></div>
    </div>
  </div>

  <!-- MAIN TACTICAL CONSOLE (LEFT: 3D J.A.R.V.I.S. CORE / RIGHT: TEXT CHAT) -->
  <main id="console-ui" class="console-container hidden">
    <header class="hud-header">
      <div class="brand">
        <span class="pulse-dot" id="status-dot"></span>
        <div>
          <div class="title">J.A.R.V.I.S.</div>
          <div class="meta" id="telemetry-bar">LINK: ENCRYPTED • DOCS INDEXED: ACTIVE • RTX 4060</div>
        </div>
      </div>
      <div class="header-actions">
        <button id="tts-toggle" class="icon-btn active" title="Toggle Voice Output">🔊 VOICE ON</button>
        <button id="lock-btn" class="icon-btn danger" title="Lock Console">🔒 LOCK</button>
      </div>
    </header>

    <div class="split-workspace">
      <!-- LEFT SIDE: 3D J.A.R.V.I.S. GRAPHIC CIRCLE / CORE -->
      <aside class="orb-panel">
        <div id="jarvis-3d-canvas" class="orb-canvas"></div>
        <div class="orb-readout">
          <div id="orb-state-label" class="orb-state">CORE STANDBY</div>
          <div class="orb-sub">WEBGL 3D CORE • CLIENT GPU</div>
        </div>
      </aside>

      <!-- RIGHT SIDE: TEXT CHAT & DIRECTIVES -->
      <section class="chat-panel">
        <section id="chat-stream" class="chat-stream">
          <div class="msg system">
            <div class="bubble">Encrypted channel established, sir. Mainframe telemetry synchronized.</div>
          </div>
        </section>

        <footer class="hud-footer">
          <div class="quick-chips">
            <button class="chip" data-cmd="System diagnostic report.">Diagnostics</button>
            <button class="chip" data-cmd="Open the Mark 95 faceplate.">Open Mask</button>
            <button class="chip" data-cmd="Close the Mark 95 faceplate.">Close Mask</button>
          </div>
          <div class="composer">
            <button id="mic-btn" class="mic-btn" title="Voice Input">🎙️</button>
            <input id="prompt-input" type="text" placeholder="Enter directive, sir..." autocomplete="off" />
            <button id="send-btn" class="send-btn">SEND</button>
          </div>
        </footer>
      </section>
    </div>
  </main>

  <script type="module" src="orb3d.js"></script>
  <script src="app.js"></script>
</body>
</html>
